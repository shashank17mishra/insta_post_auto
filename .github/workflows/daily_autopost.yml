name: Daily StudyNotes AutoPoster

on:
  schedule:
    # 3 Posts Daily (100% Automated - Zero Human Enrollment)
    # 1. Morning Post:   04:00 UTC (9:30 AM IST)
    # 2. Afternoon Post: 09:00 UTC (2:30 PM IST)
    # 3. Evening Post:   15:00 UTC (8:30 PM IST)
    - cron: '0 4,9,15 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific Topic (Leave empty to pick next pending topic)'
        required: false
        default: ''
      category:
        description: 'Category filter (e.g. Computer Science, Mathematics)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-freefont-ttf
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Generate Notes & Carousel Images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          CMD="python -m scripts.generate_post"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD="$CMD --topic \"${{ github.event.inputs.topic }}\""
          elif [ -n "${{ github.event.inputs.category }}" ]; then
            CMD="$CMD --category \"${{ github.event.inputs.category }}\""
          else
            CMD="$CMD --next"
          fi
          echo "Executing generation: $CMD"
          eval $CMD

      - name: 2. Commit & Push Images (Makes Images Live for Meta)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ generated/
          if git diff --staged --quiet; then
            echo "No new images to commit."
          else
            git commit -m "Add generated note images [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: 3. Publish Note Carousel Live to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://raw.githubusercontent.com/shashank17mishra/insta_post_auto/main' }}
          INSTAGRAM_PUBLISH_ENABLED: 'true'
          DRY_RUN: 'false'
        run: |
          python -m scripts.publish_post --latest --force --live

      - name: 4. Sync Database & Published State
        run: |
          git add data/ generated/
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update post published status [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
