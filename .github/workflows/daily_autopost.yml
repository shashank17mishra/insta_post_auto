name: Daily StudyNotes AutoPoster

on:
  schedule:
    # Runs daily at 10:00 AM UTC (3:30 PM IST)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific Topic (Leave empty to pick next pending topic)'
        required: false
        default: ''
      category:
        description: 'Category filter (e.g. Computer Science, Mathematics)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-freefont-ttf
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run StudyNotes AutoPoster Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          INSTAGRAM_PUBLISH_ENABLED: 'true'
          DRY_RUN: 'false'
        run: |
          CMD="python -m scripts.run_pipeline"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD="$CMD --topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ -n "${{ github.event.inputs.category }}" ]; then
            CMD="$CMD --category \"${{ github.event.inputs.category }}\""
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Commit & Push Changes (Database & Generated Notes)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ generated/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-published daily study notes carousel [skip ci]"
            git push origin main
          fi
