name: Generate Daily StudyNotes

on:
  schedule:
    # Runs daily at 12:00 UTC (Configurable)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific Topic Name or ID (Leave empty for next pending)'
        required: false
        default: ''
      category:
        description: 'Category filter (e.g. SQL, Mathematics)'
        required: false
        default: ''
      force_mock:
        description: 'Use built-in mock templates (no Gemini API calls)'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Note Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          INSTAGRAM_PUBLISH_ENABLED: 'false'
          DRY_RUN: 'true'
        run: |
          CMD="python -m scripts.run_pipeline"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD="$CMD --topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ -n "${{ github.event.inputs.category }}" ]; then
            CMD="$CMD --category \"${{ github.event.inputs.category }}\""
          fi
          if [ "${{ github.event.inputs.force_mock }}" = "true" ]; then
            CMD="$CMD --mock"
          fi
          eval $CMD

      - name: Upload Generated Draft Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studynotes-drafts-${{ github.run_id }}
          path: generated/drafts/
          retention-days: 14
